<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>K2BS | 小児矯正患者管理</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><aside><a class="brand" href="{{ url_for('index') }}">K2BS<span>小児矯正 患者管理</span></a><p class="nav">◉ 患者一覧</p><small>医院内での評価用・初期版<br>架空データでお試しください</small></aside><main><header><span>CLINIC WORKSPACE</span>{% if session.get('logged_in') %}<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button class="quiet">ログアウト</button></form>{% endif %}</header>{% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}<footer>患者情報・写真はこの環境内に保存されます。公開前にアクセス管理とバックアップの整備が必要です。</footer></main></body></html>
